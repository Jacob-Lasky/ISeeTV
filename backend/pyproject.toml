[project]
name = "backend"
version = "0.1.0"
description = "Backend for the ISeeTV app"
authors = [
    {name = "Jacob Lasky",email = "jacob.s.lasky@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi (>=0.115.13,<0.116.0)",
    "uvicorn (>=0.34.3,<0.35.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "asyncio (>=3.4.3,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytz (>=2025.2,<2026.0)",
    "lxml (>=6.0.0,<7.0.0)",
    "sqlalchemy (>=2.0.41,<3.0.0)",
    "apscheduler (>=3.11.0,<4.0.0)",
    "pandas (>=2.3.1,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.ruff]
lint.select = ["D"]

# Disable conflicting docstring rules
lint.ignore = [
  "D203",  # conflict with formatter: prefers no blank line before class docstring
  "D213",  # ignore 'multi-line-summary-second-line'
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
coverage = "^7.9.2"
pytest-cov = "^6.2.1"
ruff = "^0.12.2"
pyright = "^1.1.402"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
